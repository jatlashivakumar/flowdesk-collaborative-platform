version: '3.9'

# Use this for LOCAL DEVELOPMENT — starts only Postgres + Redis
# Your API and Web run natively with: pnpm dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowdesk_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk123
      POSTGRES_DB: flowdesk_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flowdesk_redis_dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
